<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stammbaum – Emote-Kreaturen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1b1424;--panel:#271d35;--line:#3d2f52;--txt:#f3eefa;--dim:#b9a9d6;--gold:#ffc93c;--green:#5fd068;--pink:#ff7fd1}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Press Start 2P',monospace}
  body{background-image:radial-gradient(#2a2040 1px,transparent 1px);background-size:8px 8px}
  canvas{image-rendering:pixelated;display:block}
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
  header{text-align:center;margin-bottom:28px}
  h1{color:var(--gold);font-size:26px;margin:0 0 14px;text-shadow:4px 4px 0 #000}
  .sub{color:var(--dim);font-size:10px;line-height:1.8}
  .sub a{color:var(--txt)}
  .px-box{background:var(--panel);border:4px solid #fff;box-shadow:6px 6px 0 #000}
  .now{display:flex;gap:24px;align-items:center;padding:20px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
  .now .tag{color:var(--green);font-size:10px;margin-bottom:12px}
  .now h2{font-size:18px;margin:0 0 14px}
  .info{font-size:9px;line-height:2.1;color:var(--dim)}
  .info b{color:var(--txt);font-weight:normal}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
  .stat{padding:12px 8px;text-align:center}
  .stat .n{font-size:16px;color:var(--gold);margin-bottom:8px}
  .stat .l{font-size:7px;color:var(--dim)}
  .bar{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
  .bar button{font:9px 'Press Start 2P',monospace;background:var(--panel);color:var(--txt);border:3px solid var(--line);padding:9px 12px;cursor:pointer}
  .bar button.on{border-color:var(--gold);color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--panel);border:3px solid var(--line);padding:10px;cursor:pointer;text-align:center;position:relative;transition:transform .1s}
  .card:hover{transform:translateY(-3px);border-color:#fff}
  .card.shiny{border-color:var(--gold)}
  .card canvas{margin:0 auto 8px}
  .card .g{font-size:7px;color:var(--gold);margin-bottom:7px}
  .card .nm{font-size:9px;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .e{font-size:7px;color:var(--dim)}
  .badges{position:absolute;top:6px;right:6px;display:flex;gap:4px}
  .badge{font-family:system-ui,sans-serif;font-size:10px;line-height:1;padding:3px 4px;background:#000;border:2px solid var(--gold);color:var(--gold)}
  .badge.m{border-color:var(--pink);color:var(--pink)}
  .empty{text-align:center;color:var(--dim);font-size:10px;line-height:2;padding:30px}
  .modal{position:fixed;inset:0;background:rgba(10,6,16,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
  .modal.on{display:flex}
  .modal .px-box{max-width:640px;width:100%;padding:20px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-height:92vh;overflow:auto;position:relative}
  .modal h3{font-size:16px;margin:0 0 12px}
  .close{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;font:14px 'Press Start 2P';cursor:pointer}
  .traits{display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:8px;margin-top:12px}
  .traits span:nth-child(odd){color:var(--dim)}
  footer{text-align:center;margin-top:36px;font-size:8px;color:var(--dim);line-height:2}
  footer a{color:var(--gold)}
  @media (max-width:560px){ h1{font-size:18px} .stats{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:repeat(2,1fr)} }
</style>

<body>

<script>
(() => {
'use strict';
const CONFIG = { channel: 'scroplex', scale: 4, stages: [0, 20, 70, 100, 150], stageNames: ['Ei', 'Larve', 'Jungtier', 'Ausgewachsen', 'Endform'] };
const W = 48, H = 48, SC = CONFIG.scale;
let S = { total: 0 }, evo = null, shown = 0;
/* ======================= GENE & EMOTES ======================= */
const GENES = {
  hype:   { label: 'Hype',   color: '#ffc93c', hue: 45 },
  lach:   { label: 'Lachen', color: '#5fd068', hue: 125 },
  trauer: { label: 'Trauer', color: '#4f9dff', hue: 212 },
  wut:    { label: 'Wut',    color: '#ff5a4f', hue: 4 },
  liebe:  { label: 'Liebe',  color: '#ff7fd1', hue: 318 },
};
const GENE_KEYS = Object.keys(GENES);
const EMOTE_GENES = {
  hype:   ['Pog','PogChamp','POGGERS','PogU','POGGIES','PagMan','PagChomp','PogBones','HYPERS','EZ','Clap','GIGACHAD','Kreygasm','SeemsGood','CurseLit','catJAM','peepoClap','PowerUpL','PowerUpR','TwitchLit','pepeJAM','LETSGO','POGSLIDE','GoldPLZ'],
  lach:   ['KEKW','LUL','LULW','OMEGALUL','Kappa','4Head','haHAA','ICANT','xdd','KEK','KEKL','Jebaited','pepeLaugh','EleGiggle','LuL','xD','XD','DinoDance','Clueless'],
  trauer: ['Sadge','BibleThump','PepeHands','FeelsBadMan','F','o7','NotLikeThis','monkaS','Copium','Hopium','peepoSad','widepeepoSad','PoroSad','Deadge','Aware','Waiting','sadKEK'],
  wut:    ['SwiftRage','DansGame','WeirdChamp','Madge','BabyRage','SMOrc','FailFish','Stare','ANGERY','REEEE','pepeMeltdown','Susge','MrDestructoid','ResidentSleeper'],
  liebe:  ['<3','peepoHappy','widepeepoHappy','VirtualHug','bleedPurple','HeyGuys','KappaPride','TwitchUnity','peepoLove','FeelsGoodMan','FeelsStrongMan','PETTHEPEEPO','catKISS','ppHug','HUGGIES','peepoShy','AYAYA','GivePLZ','TakeNRG','VoHiYo','pepeLove'],
};
const GENE_OF = {};
for (const g of GENE_KEYS) for (const n of EMOTE_GENES[g]) GENE_OF[n] = g;
const FALLBACK = new Set(Object.keys(GENE_OF));

/* ======================= KÖRPERTEIL-BAUKASTEN ======================= */
// Jede Option hat eine "Vorliebe" für bestimmte Gene. Bei jeder Entwicklung gewinnt die Option,
// die am besten zu den Emotes der letzten Phase passt (plus etwas Zufall, je Kanal & Generation anders).
const PARTS = {
  body:    { rund: { lach: .8, liebe: .4 }, gross: { hype: .9 }, breit: { wut: .9, lach: .2 }, birne: { trauer: .9 }, mochi: { liebe: .9, trauer: .2 },
             tropfen: { trauer: .6, liebe: .4 }, eckig: { wut: .6, hype: .4 }, ei: { lach: .55, hype: .3 }, pilz: { lach: .5, liebe: .3, _u: .8 }, geisterform: { trauer: .7, _u: .6 } },
  top:     { none: { _: .18 }, katze: { liebe: .6, lach: .3 }, hase: { trauer: .55, liebe: .35 }, hoerner: { wut: .9 }, kamm: { wut: .45, hype: .45 }, antennen: { hype: .85 },
             spross: { lach: .65, liebe: .2 }, flamme: { hype: .5, wut: .5 }, einhorn: { liebe: .55, hype: .45 }, baer: { liebe: .5, lach: .4 }, teufel: { wut: .7, lach: .2 },
             geweih: { trauer: .45, wut: .45 }, haarbuschel: { lach: .7 }, blume: { liebe: .7, lach: .2 }, flossen: { trauer: .75 }, stacheln: { wut: .6, hype: .3 } },
  eyes:    { punkt: { lach: .45, _: .15 }, gross: { liebe: .7, hype: .2 }, muede: { trauer: .85 }, boese: { wut: .9 }, sterne: { hype: .8 },
             herz: { liebe: .8 }, kreuz: { lach: .6, trauer: .2 }, schlitz: { wut: .6, hype: .3 }, glubsch: { lach: .5, hype: .4 }, oval: { trauer: .5, liebe: .4 } },
  mouth:   { laecheln: { lach: .9 }, zaehne: { wut: .85 }, traurig: { trauer: .85 }, offen: { hype: .8 }, katze: { liebe: .85 },
             zunge: { lach: .6, hype: .3 }, grinsen: { hype: .55, wut: .4 }, o: { trauer: .5, hype: .3 }, schnabel: { hype: .5, lach: .3 }, fangzahn: { wut: .5, liebe: .4 } },
  pattern: { none: { _: .2 }, punkte: { lach: .45, _u: 1.2 }, streifen: { wut: .5, hype: .3 }, bauch: { liebe: .55 }, zweiton: { trauer: .55 }, sterne: { hype: .45, liebe: .1 },
             herzen: { liebe: .65 }, karo: { lach: .5, _u: .6 }, blitz: { hype: .6, wut: .3 }, kuh: { lach: .4, trauer: .3 }, maske: { wut: .4, trauer: .4 }, ringel: { hype: .3, lach: .3, _u: .6 } },
  tail:    { none: { _: .2 }, stummel: { lach: .45 }, locke: { liebe: .6 }, stachel: { wut: .75 }, flamme: { hype: .7 }, tropfen: { trauer: .7 },
             fisch: { trauer: .6, _u: .6 }, buschig: { liebe: .55, lach: .25 }, blitz: { hype: .65 }, keule: { wut: .65 }, katze: { lach: .4, liebe: .4 }, pinsel: { lach: .5, trauer: .2 } },
  arms:    { stummel: { lach: .45, liebe: .35 }, krallen: { wut: .85 }, fluegelchen: { hype: .6, liebe: .2 }, lang: { trauer: .75 },
             scheren: { wut: .55, _u: .8 }, flossen: { trauer: .55, _u: .5 }, winken: { lach: .5, liebe: .45 }, muskel: { hype: .55, wut: .45 } },
  extra:   { fluegel: { hype: .75 }, heiligenschein: { liebe: .85 }, krone: { lach: .6, hype: .25 }, wolke: { trauer: .9 }, aura: { wut: .9 },
             blitzaura: { hype: .7, wut: .2 }, herzorbit: { liebe: .7, lach: .2 }, zauberhut: { lach: .45, trauer: .4 }, schmetterling: { liebe: .5, lach: .4 }, drachenfluegel: { wut: .65, trauer: .25 } },
  scheme:  { normal: { _: .25 }, analog: { trauer: .4, liebe: .3 }, komplementaer: { wut: .45, lach: .35 }, pastell: { liebe: .6, trauer: .2 }, neon: { hype: .7 },
             dunkel: { wut: .4, trauer: .45 }, verlauf: { liebe: .4, lach: .35 }, spitzen: { lach: .35, wut: .35 }, metallic: { hype: .45, wut: .35 }, halbiert: { _u: 1.2, lach: .15 } },
};
const SLOT_STAGE = { body: 1, eyes: 1, mouth: 1, top: 1, pattern: 1, scheme: 1, tail: 2, arms: 3, extra: 4 };
const MUTATIONS = {
  regenbogen:  'Regenbogen',
  gold:        'Goldglanz',
  schatten:    'Schattenwesen',
  geist:       'Geisterhaft',
  drittesauge: 'Drittes Auge',
  zyklop:      'Zyklop',
};


/* ======================= HILFSFUNKTIONEN ======================= */
const now = () => performance.now() / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgbOf(c){ if (Array.isArray(c)) return c; const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c, f){ return rgbOf(c).map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f)); }
function css(c){ c = rgbOf(c); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function hsl(h, s, l){ h = ((h % 360) + 360) % 360; s /= 100; l /= 100; const k = n => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l); const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)]; }
function palOf(c){ return { base: css(c), light: css(mix(c, .35)), dark: css(mix(c, -.3)) }; }
const zeroGenes = () => ({ hype: 0, lach: 0, trauer: 0, wut: 0, liebe: 0 });
function shares(genes){ const tot = GENE_KEYS.reduce((a, k) => a + (genes[k] || 0), 0); const s = {}; GENE_KEYS.forEach(k => s[k] = tot ? genes[k] / tot : 0); return { s, tot }; }
function sortedGenes(genes){ return GENE_KEYS.slice().sort((a, b) => genes[b] - genes[a]); }
const SEED = hash(CONFIG.channel);


/* ======================= PIXEL-RENDERER ======================= */
const cv = $('cv'); cv.width = W * SC; cv.height = H * SC;
const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const lo = document.createElement('canvas'); lo.width = W; lo.height = H;
const lx = lo.getContext('2d');
const ghost = document.createElement('canvas'); ghost.width = W; ghost.height = H;
const M = new Uint8Array(W * H);
const OUT = '#1b1424';
const RAINBOW = ['#ff5a4f', '#ff9f3c', '#ffd84a', '#5fd068', '#4f9dff', '#b07cff'];

function mset(x, y, v, only){ x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return; const i = y * W + x; if (only !== undefined && M[i] !== only) return; M[i] = v; }
function mget(x, y){ return (x < 0 || y < 0 || x >= W || y >= H) ? 0 : M[y * W + x]; }
function ell(cx, cy, rx, ry, v, only, shear = 0, py = cy, n = 2){
  for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry) + 1; y++){
    const s = Math.round(shear * (py - y));
    for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx) + 1; x++){
      const dx = Math.abs((x + .5 - cx) / rx), dy = Math.abs((y + .5 - cy) / ry);
      if (Math.pow(dx, n) + Math.pow(dy, n) <= 1) mset(x + s, y, v, only);
    }
  }
}
function tri(ax, ay, bx, by, qx, qy, v, only){
  const minX = Math.floor(Math.min(ax, bx, qx)), maxX = Math.ceil(Math.max(ax, bx, qx));
  const minY = Math.floor(Math.min(ay, by, qy)), maxY = Math.ceil(Math.max(ay, by, qy));
  const d = (bx - ax) * (qy - ay) - (by - ay) * (qx - ax); if (!d) return;
  for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++){
    const px_ = x + .5, py_ = y + .5;
    const w1 = ((bx - px_) * (qy - py_) - (by - py_) * (qx - px_)) / d;
    const w2 = ((qx - px_) * (ay - py_) - (qy - py_) * (ax - px_)) / d;
    const w3 = 1 - w1 - w2;
    if (w1 >= -.02 && w2 >= -.02 && w3 >= -.02) mset(x, y, v, only);
  }
}
function spike(x, y, w, h, v){ for (let i = 0; i < h; i++){ const ww = Math.max(1, Math.round(w * (1 - i / h))); const x0 = Math.round(x - ww / 2); for (let k = 0; k < ww; k++) mset(x0 + k, y - i, v); } }
function px(x, y, c){ lx.fillStyle = c; lx.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(x, y, w, h, c){ lx.fillStyle = c; lx.fillRect(Math.round(x), Math.round(y), w, h); }
function edge(x, y){ return mget(x, y) && (!mget(x - 1, y) || !mget(x + 1, y) || !mget(x, y - 1) || !mget(x, y + 1)); }
function paint(pal){
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const v = M[y * W + x]; if (!v) continue;
    if (edge(x, y)){ px(x, y, OUT); continue; }
    const p = pal[v] || pal[1]; let c = p.base;
    if (edge(x + 1, y) || edge(x, y + 1) || edge(x + 1, y + 1)) c = p.dark;
    else if (edge(x - 1, y) || edge(x, y - 1)) c = p.light;
    px(x, y, c);
  }
}
function topY(x){ x = Math.round(x); for (let y = 0; y < H; y++) if (mget(x, y)) return y; return H; }
const HEART = ['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'];
function sprite(pat, x, y, c){ pat.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === 'X') px(x + i, y + j, c); })); }
function sprite2(pat, x, y, map){ pat.forEach((row, j) => [...row].forEach((ch, i) => { if (map[ch]) px(x + i, y + j, map[ch]); })); }
const CLOUD = ['....oooo.......', '..oowwwwoooo....', '.owwwwwwwwwwo...', 'owwwwwwwwwwwwoo.', 'owwwwwwwwwwwwwwo', 'owggwwwwwwwwggwo', '.oogggggggggggo.', '...oooooooooo...'];
const CROWN = ['.o...o...o.', 'oyo.oyo.oyo', 'oyyoyyyoyyo', 'oyyyyyyyyyo', 'oyryyyyyryo', 'ooooooooooo'];

/* ---------- Animation & Partikel ---------- */
let reactState = null, wobble = 0, blinkUntil = 0, nextBlink = now() + 2, flashKick = 0;
const parts = [];
function spawn(kind, x, y, vx, vy, life, color){ if (parts.length < 90) parts.push({ kind, x, y, vx, vy, life, max: life, color }); }
function react(g){
  reactState = { type: g, t0: now(), dur: g === 'hype' ? .5 : .6 };
  wobble = 1;
  const c = GENES[g].color, cx = 24, cy = shown === 0 ? 22 : 24;
  if (g === 'liebe') for (let i = 0; i < 2; i++) spawn('heart', cx - 6 + Math.random() * 10, cy - 4, (Math.random() - .5) * 4, -10, 1.3, c);
  else if (g === 'wut') spawn('bang', cx + 9, cy - 10, 0, -4, .7, c);
  else for (let i = 0; i < 5; i++) spawn('pix', cx + (Math.random() - .5) * 14, cy - 6, (Math.random() - .5) * 16, -8 - Math.random() * 10, .7, c);
}
function burst(fromEgg){
  if (fromEgg) for (let i = 0; i < 14; i++){ const a = Math.random() * Math.PI * 2; spawn('shard', 24, 30, Math.cos(a) * 22, Math.sin(a) * 22 - 12, 1.1, '#f4ecd8'); }
  for (let i = 0; i < 16; i++){ const a = Math.random() * Math.PI * 2; spawn('spark', 24, 30, Math.cos(a) * 18, Math.sin(a) * 18, .9, '#fff6c2'); }
}

/* ---------- Ei ---------- */
function drawEgg(t, ph, ox, oy, A = {}){
  const R = rng(ph.seed);
  const cx = 24 + ox, rx = 9 + R() * 1.6, ry = 11.5 + R() * 1.6, cy = 44 - ry + oy, py = cy + ry;
  const variant = Math.floor(R() * 3);
  let shear = A.still ? 0 : (wobble > 0 ? Math.sin(t * 25) * .12 * wobble : Math.sin(t * 1.5) * .03);
  if (!A.still && evo && evo.type === 'evo') shear = Math.sin(t * 40) * .22 * Math.min(1, (t - evo.t0) / 1.2);
  ell(cx, cy, rx, ry, 4, undefined, shear, py);
  const sh = y => Math.round(shear * (py - y));
  if (variant !== 1){
    const n = 3 + Math.floor(R() * 4);
    for (let i = 0; i < n; i++){
      const a = R() * Math.PI * 2, d = .25 + R() * .45;
      const sx = cx + Math.cos(a) * rx * d, sy = cy + Math.sin(a) * ry * d;
      ell(sx + sh(sy), sy, 1.3 + R() * 1.3, 1.2 + R(), 5, 4);
    }
  }
  if (variant !== 0){
    const by = cy + ry * (.15 + R() * .2), amp = R() < .5 ? 1 : 0, f = .8 + R() * .8;
    for (let x = Math.floor(cx - rx - 2); x <= cx + rx + 2; x++) for (let k = 0; k < 2; k++){
      const y = Math.round(by + amp * Math.sin(x * f) + k); mset(x + sh(y), y, 5, 4);
    }
  }
  const shell = ph.parentHue != null ? hsl(ph.parentHue, 40, 88) : [244, 236, 216];
  const spots = ph.neutral ? (ph.parentHue != null ? hsl(ph.parentHue, 45, 62) : [203, 189, 159]) : hsl(ph.h, ph.s, ph.l);
  paint({ 4: palOf(shell), 5: palOf(spots) });
  // Risse
  const C = rng(ph.seed ^ 0xabc); const pts = []; let yy = 0;
  for (let x = -7; x <= 7; x++){ pts.push([x, yy]); if (C() < .55){ yy = clamp(yy + (C() < .5 ? -1 : 1), -2, 2); pts.push([x, yy]); } }
  const p = Math.min(1, S.total / CONFIG.stages[1]);
  const n = A.cracks != null ? A.cracks : Math.floor(pts.length * p);
  for (let i = 0; i < n; i++){
    const [x, y] = pts[i]; const yv = Math.round(cy - 3 + y), xv = cx + x + sh(yv);
    if (mget(xv, yv) && !edge(xv, yv)) px(xv, yv, OUT);
  }
}

/* ---------- Körperteile ---------- */

    three(x => { [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]].forEach(([a, b]) => px(x + a, ey - 1 + b, eyeCol)); px(x + 1, ey, '#ffe14a'); });
  } else if (eyes === 'herz'){
    three(x => sprite(SMALL_HEART, x, ey - 1, '#ff4d8d'));
  } else if (eyes === 'kreuz'){
    three(x => [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]].forEach(([a, b]) => px(x + a, ey - 1 + b, eyeCol)));
  } else if (eyes === 'schlitz'){
    three(x => { rect(x, ey - 1, 3, 3, '#ffd23f'); rect(x + 1, ey - 1, 1, 3, eyeCol); });
  } else if (eyes === 'glubsch'){
    const dx = A.still ? 1 : Math.round(1 + Math.sin(t * 1.7));
    three(x => { rect(x - 1, ey - 2, 5, 5, OUT); rect(x, ey - 1, 3, 3, '#ffffff'); px(x + dx, ey, eyeCol); });
  } else if (eyes === 'oval'){
    for (const x of [L, Rr]){ rect(x, ey - 1, 2, 3, eyeCol); if (big) px(x, ey - 1, '#fff'); }
  } else {
    for (const x of [L, Rr]){ rect(x, ey, 2, 2, eyeCol); if (big) px(x, ey, '#fff'); }
    if (eyes === 'drei'){ rect(c - 1, ey - 4, 2, 2, eyeCol); if (big) px(c - 1, ey - 4, '#fff'); }
  }
  if (eyes === 'boese' && !closed){ px(L, ey - 2, OUT); px(L + 1, ey - 1, OUT); px(Rr + 1, ey - 2, OUT); px(Rr, ey - 1, OUT); }
  const my = ey + 3 + (st >= 3 ? 1 : 0) + (eyes === 'glubsch' ? 1 : 0);
  const mouth = A.mouthOpen ? 'offen' : ph.mouth;
  if (mouth === 'offen'){ rect(c - 2, my, 4, 2, OUT); rect(c - 1, my + 1, 2, 1, '#ff6f91'); }
  else if (mouth === 'laecheln'){ px(c - 3, my, OUT); rect(c - 2, my + 1, 4, 1, OUT); px(c + 2, my, OUT); }
  else if (mouth === 'zaehne'){ rect(c - 2, my, 4, 1, OUT); px(c - 2, my + 1, '#ffffff'); px(c + 1, my + 1, '#ffffff'); }
  else if (mouth === 'traurig'){ px(c - 2, my + 1, OUT); rect(c - 1, my, 2, 1, OUT); px(c + 1, my + 1, OUT); }
  else if (mouth === 'katze'){ [[-3, 0], [-2, 1], [-1, 0], [0, 0], [1, 1], [2, 0]].forEach(([a, b]) => px(c + a, my + b, OUT)); }
  else if (mouth === 'zunge'){ rect(c - 2, my, 4, 1, OUT); rect(c - 1, my + 1, 2, 1, '#ff6f91'); px(c, my + 2, '#d94f7a'); px(c - 1, my + 2, '#ff6f91'); }
  else if (mouth === 'grinsen'){ rect(c - 3, my, 6, 3, OUT); rect(c - 2, my + 1, 4, 1, '#ffffff'); }
  else if (mouth === 'o'){ rect(c - 1, my, 2, 2, OUT); }
  else if (mouth === 'schnabel'){ rect(c - 2, my - 1, 4, 1, '#ffa13c'); rect(c - 1, my, 2, 1, '#ff8a1c'); px(c - 2, my, OUT); px(c + 1, my, OUT); rect(c - 1, my + 1, 2, 1, OUT); }
  else if (mouth === 'fangzahn'){ rect(c - 2, my, 4, 1, OUT); px(c + 2, my - 1, OUT); px(c - 1, my + 1, '#ffffff'); }
  else rect(c - 1, my, 2, 1, OUT);
  if (mouth === 'katze' || ph.eyes === 'gross' || ph.eyes === 'herz'){ rect(L - 2, ey + 2, 2, 1, '#ff8fb3'); rect(Rr + 2, ey + 2, 2, 1, '#ff8fb3'); }
  if ((ph.eyes === 'muede' || ph.mouth === 'traurig') && !closed && !A.still){ const p = (t % 4) / 4; if (p < .5) px(L, ey + 2 + Math.floor(p * 10), '#8fd8ff'); }

  // ---- Extras der Endform (vorne) ----
  if (st >= 4){
    const bob = A.still ? 0 : Math.round(Math.sin(t * 2.5));
    if (ph.extra === 'heiligenschein'){
      const hy = top - 5 + bob; const seen = new Set();
      for (let a = 0; a < Math.PI * 2; a += .12){ const x = Math.round(c + Math.cos(a) * 6 - .5), y = Math.round(hy + Math.sin(a) * 1.6); const k = x + ',' + y; if (seen.has(k)) continue; seen.add(k); px(x, y, '#ffe66b'); }
    } else if (ph.extra === 'wolke'){
      const yc = Math.max(0, top - 15 + bob);
      sprite2(CLOUD, c - 8, yc, { o: OUT, w: '#e8eef5', g: '#b9c4d2' });
      if (!A.still && Math.random() < .08) spawn('drop', c - 5 + Math.random() * 10, yc + 8, 0, 18, .6, '#8fd8ff');
    } else if (ph.extra === 'krone'){
      sprite2(CROWN, c - 6, top - 4, { o: OUT, y: '#ffd84a', r: '#ff4d6d' });
    } else if (ph.extra === 'zauberhut'){
      sprite2(ZHAT, c - 6, Math.max(0, top - 7), { o: OUT, p: '#6b4bd6', y: '#ffd84a' });
    } else if (ph.extra === 'herzorbit'){
      for (let k = 0; k < 2; k++){ const a = (A.still ? .6 : t * 2) + k * Math.PI; sprite(SMALL_HEART, Math.round(c + Math.cos(a) * (rx + 3) - 1.5), Math.round(cy - ry * .2 + Math.sin(a) * 3), '#ff6fae'); }
    } else if (ph.extra === 'aura' && !A.still && Math.random() < .35){
      spawn('ember', cx + (Math.random() - .5) * 2 * rx, cy + (Math.random() - .3) * ry, 0, -10 - Math.random() * 6, .8, Math.random() < .5 ? '#ff5a3c' : '#ffb03c');
    } else if (ph.extra === 'blitzaura' && !A.still && Math.random() < .25){
      spawn('bolt', cx + (Math.random() - .5) * 2 * (rx + 3), cy + (Math.random() - .5) * 2 * ry, 0, 0, .25, '#ffe14a');
    }
  }
  if ((muts.includes('gold') || ph.shiny) && !A.still && Math.random() < .06) spawn('spark', cx + (Math.random() - .5) * 2 * rx, cy + (Math.random() - .5) * 2 * ry, 0, -3, .6, '#fff6c2');
}
function drawParts(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'shard' || p.kind === 'pix' || p.kind === 'drop') p.vy += 40 * dt;
    const c = css(p.color);
    if (p.kind === 'heart') sprite(HEART, p.x, p.y, c);
    else if (p.kind === 'bang'){ rect(p.x, p.y, 1, 3, c); px(p.x, p.y + 4, c); }
    else if (p.kind === 'shard'){ rect(p.x, p.y, 2, 2, c); px(p.x + 1, p.y + 1, OUT); }
    else if (p.kind === 'spark'){ px(p.x, p.y, c); if (p.life > p.max / 2){ px(p.x - 1, p.y, c); px(p.x + 1, p.y, c); px(p.x, p.y - 1, c); px(p.x, p.y + 1, c); } }
    else if (p.kind === 'bolt'){ px(p.x, p.y, c); px(p.x + 1, p.y + 1, c); px(p.x, p.y + 2, c); }
    else if (p.kind === 'ember'){ if (p.life > p.max * .3) px(p.x, p.y, c); }
    else px(p.x, p.y, c);
  }
}

/* ---------- Porträt (für Stammbaum) ---------- */
function portrait(ph, st, scale){
  M.fill(0); lx.globalCompositeOperation = 'source-over'; lx.globalAlpha = 1; lx.clearRect(0, 0, W, H);
  const A = { ox: 0, oy: 0, sq: 0, still: true };
  if (st === 0) drawEgg(0, ph, 0, 0, A); else drawCreature(0, ph, st, A);
  if ((ph.muts || []).includes('geist')){ lx.globalCompositeOperation = 'destination-in'; lx.fillStyle = 'rgba(0,0,0,.62)'; lx.fillRect(0, 0, W, H); lx.globalCompositeOperation = 'source-over'; }
  const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(lo, 0, 0, c.width, c.height);
  return c;
}



const SLOT_NAMES = { body: 'Körper', top: 'Kopf', eyes: 'Augen', mouth: 'Mund', pattern: 'Muster', scheme: 'Farbschema', tail: 'Schwanz', arms: 'Arme', extra: 'Extra' };
const SPECIAL = { gross: 'Groß', none: '–', punkt: 'Knopfaugen', o: 'O-Mund', katze: 'Katze', geisterform: 'Geist' };
const pretty = v => SPECIAL[v] || (v.replace(/ae/g, 'ä').replace(/oe/g, 'ö').replace(/ue/g, 'ü').replace(/^./, c => c.toUpperCase()));
const star = p => p && p.shiny ? '★ ' : '';
let data = null, filter = 'all', oldFirst = false;

function card(a){
  const el = document.createElement('div');
  const muts = (a.pheno && a.pheno.muts) || [];
  el.className = 'card' + (a.pheno && a.pheno.shiny ? ' shiny' : '');
  el.appendChild(portrait(a.pheno, 4, 2));
  el.insertAdjacentHTML('beforeend', `<div class="g">GEN ${a.gen}</div><div class="nm">${esc(star(a.pheno) + (a.name || 'Namenlos'))}</div><div class="e">${a.total} Emotes</div>
    <div class="badges">${a.pheno && a.pheno.shiny ? '<span class="badge">★</span>' : ''}${muts.length ? '<span class="badge m">M</span>' : ''}</div>`);
  el.onclick = () => openModal(a, 4);
  return el;
}
function openModal(a, st){
  const box = $('mbox'); box.innerHTML = '<button class="close" aria-label="Schließen">×</button>';
  box.appendChild(portrait(a.pheno, st, 5));
  const ph = a.pheno || {}, muts = ph.muts || [];
  const parts = Object.keys(SLOT_NAMES).filter(k => ph[k]).map(k => `<span>${SLOT_NAMES[k]}</span><span>${pretty(ph[k])}</span>`).join('');
  box.insertAdjacentHTML('beforeend', `<div style="flex:1;min-width:220px">
    <div class="tag" style="color:var(--gold);font-size:9px;margin-bottom:10px">GEN ${a.gen}${a.alive ? ' · LEBT' : ''}</div>
    <h3>${esc(star(ph) + (a.name || 'Namenlos'))}</h3>
    <div class="info">
      <b>${a.total}</b> Emotes${a.alive ? ' · ' + CONFIG.stageNames[st] : ''}<br>
      Top-Spender: <b>${esc(a.feeder || '–')}</b><br>
      Lieblings-Emote: <b>${esc(a.emote || '–')}</b><br>
      ${a.date ? 'Ins Stammbuch: <b>' + a.date + '</b><br>' : ''}
      ${ph.shiny ? '<span style="color:var(--gold)">★ Schillerndes Exemplar</span><br>' : ''}
      ${muts.length ? 'Mutation: <b style="color:var(--pink)">' + muts.map(m => MUTATIONS[m] || m).join(', ') + '</b><br>' : ''}
    </div>
    ${parts ? '<div class="traits">' + parts + '</div>' : ''}</div>`);
  box.querySelector('.close').onclick = closeModal;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderGrid(){
  const g = $('grid'); g.innerHTML = '';
  let list = (data.ancestors || []).slice();
  if (filter === 'shiny') list = list.filter(a => a.pheno && a.pheno.shiny);
  if (filter === 'mut') list = list.filter(a => a.pheno && (a.pheno.muts || []).length);
  list.sort((a, b) => oldFirst ? a.gen - b.gen : b.gen - a.gen);
  if (!list.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1">${(data.ancestors || []).length ? 'Keine passenden Generationen.' : 'Noch keine Vorfahren –<br>die erste Kreatur lebt noch!'}</div>`; return; }
  list.forEach(a => g.appendChild(card(a)));
}
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
  if (b.dataset.f === 'old'){ oldFirst = !oldFirst; b.classList.toggle('on', oldFirst); }
  else { filter = b.dataset.f; document.querySelectorAll('#filters button').forEach(x => { if (x.dataset.f !== 'old') x.classList.toggle('on', x === b); }); }
  renderGrid();
});

// lebende Kreatur animiert
const cvx = $('cv'); cvx.width = W * SC; cvx.height = H * SC;
function live(){
  const c = data.current; if (!c) return;
  const t = now();
  if (t > nextBlink){ blinkUntil = t + .12; nextBlink = t + 2.5 + Math.random() * 3; }
  M.fill(0); lx.globalCompositeOperation = 'source-over'; lx.clearRect(0, 0, W, H);
  S.total = c.total;
  if (c.stage === 0) drawEgg(t, c.pheno, 0, 0, { still: false });
  else {
    drawCreature(t, c.pheno, c.stage, { ox: 0, oy: Math.sin(t * 3) > .4 ? -1 : 0, sq: 0, blink: t < blinkUntil });
    if ((c.pheno.muts || []).includes('geist')){ lx.globalCompositeOperation = 'destination-in'; lx.fillStyle = 'rgba(0,0,0,.62)'; lx.fillRect(0, 0, W, H); lx.globalCompositeOperation = 'source-over'; }
  }
  drawParts(1 / 60);
  const g = cvx.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, cvx.width, cvx.height); g.drawImage(lo, 0, 0, cvx.width, cvx.height);
  requestAnimationFrame(live);
}

async function start(){
  try {
    const r = await fetch('stammbaum.json?v=' + Date.now(), { cache: 'no-store' });
    data = await r.json();
  } catch (e) { $('sub').textContent = 'Stammbaum konnte nicht geladen werden.'; return; }
  CONFIG.channel = data.channel || CONFIG.channel;
  const ch = esc(CONFIG.channel);
  $('sub').innerHTML = `Die Emote-Kreaturen von <a href="https://twitch.tv/${ch}" target="_blank" rel="noopener">${ch}</a><br>Stand: ${esc(data.exported || '–')}`;
  document.title = `Stammbaum – ${CONFIG.channel}`;
  const anc = data.ancestors || [], c = data.current;
  if (c){
    $('now').style.display = 'flex';
    $('nowName').textContent = star(c.pheno) + (c.name || '???');
    const next = c.stage < 4 ? CONFIG.stages[c.stage + 1] : CONFIG.stages[4] + 50;
    $('nowInfo').innerHTML = `Generation <b>${c.gen}</b> · <b>${CONFIG.stageNames[c.stage]}</b><br><b>${c.total}</b> / ${next} Emotes<br>Top-Spender: <b>${esc(c.feeder || '–')}</b><br>Lieblings-Emote: <b>${esc(c.emote || '–')}</b>`;
    $('now').style.cursor = 'pointer';
    $('now').onclick = () => openModal(Object.assign({ alive: true }, c), c.stage);
    requestAnimationFrame(live);
  }
  const total = anc.reduce((a, x) => a + (x.total || 0), 0) + (c ? c.total : 0);
  const stats = [[anc.length + (c ? 1 : 0), 'Generationen'], [anc.filter(a => a.pheno && a.pheno.shiny).length, 'Schillernde'], [anc.filter(a => a.pheno && (a.pheno.muts || []).length).length, 'Mutierte'], [total.toLocaleString('de-DE'), 'Emotes gesamt']];
  $('stats').innerHTML = stats.map(([n, l]) => `<div class="stat px-box"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  $('foot').innerHTML = `Füttere die aktuelle Kreatur live mit Emotes auf <a href="https://twitch.tv/${ch}" target="_blank" rel="noopener">twitch.tv/${ch}</a>`;
  renderGrid();
}
start();
})();
</script>
